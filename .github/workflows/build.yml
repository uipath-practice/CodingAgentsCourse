name: Build check
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: pip install -r requirements.txt
      - run: COURSE_ENV=prod mkdocs build --strict
        env: { NO_MKDOCS_2_WARNING: '1' }
