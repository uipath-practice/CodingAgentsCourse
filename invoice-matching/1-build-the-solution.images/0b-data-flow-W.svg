<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 120 1600 776" font-family="AktivGrotesk, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#182126"/>
    </marker>
    <style>
      .h1 { font-size:40px; font-weight:700; fill:#182126; }
      .sub { font-size:22px; fill:#4D5459; }
      .ptype { font-size:13px; font-weight:700; letter-spacing:1.5px; fill:#6B6B6B; }
      .bt { font-size:20px; font-weight:700; fill:#182126; }
      .bd { font-size:16px; fill:#4D5459; }
      .flow { stroke:#182126; stroke-width:2.2; fill:none; marker-end:url(#a); }
      .pill rect { fill:#CCF2FF; stroke:#1E6482; stroke-width:1.6; }
      .pt { font-size:17px; font-weight:700; fill:#1E6482; text-anchor:middle; }
      .ps { font-size:14px; fill:#1E6482; text-anchor:middle; }
      .rl { font-size:16px; font-weight:700; fill:#182126; }
    </style>
  </defs>
  <rect y="120" width="1600" height="776" fill="#FFFFFF"/>

  <!-- Maestro container -->
  <rect x="40" y="150" width="1520" height="730" rx="18" fill="#FFF6F2" stroke="#FA4616" stroke-width="2.5"/>
  <rect x="64" y="134" width="410" height="34" rx="17" fill="#FA4616"/>
  <text x="269" y="157" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">MAESTRO PROCESS · BPMN OR FLOW</text>

  <!-- ===== Row 1 ===== -->
  <!-- start: you run Debug -->
  <rect x="70" y="230" width="140" height="130" rx="14" fill="#182126"/>
  <text x="86" y="262" class="ptype" style="fill:#A5E2F0">YOU START IT</text>
  <text x="86" y="294" font-size="20" font-weight="700" fill="#FFFFFF">Debug in</text>
  <text x="86" y="319" font-size="20" font-weight="700" fill="#FFFFFF">Studio Web</text>

  <!-- generator -->
  <rect x="361" y="230" width="180" height="130" rx="14" fill="#EEEFF0" stroke="#C9CCCE" stroke-width="2"/>
  <text x="377" y="260" class="ptype">RPA PROCESS</text>
  <text x="377" y="292" class="bt">Retrieve Invoice</text>
  <text x="377" y="317" class="bt">Document</text>

  <!-- IXP -->
  <rect x="692" y="230" width="180" height="130" rx="14" fill="#EEEFF0" stroke="#C9CCCE" stroke-width="2"/>
  <text x="708" y="260" class="ptype">RPA + IXP</text>
  <text x="708" y="292" class="bt">Extract Invoice</text>
  <text x="708" y="317" class="bt">Data</text>

  <!-- PO lookup -->
  <rect x="1023" y="230" width="180" height="130" rx="14" fill="#EEEFF0" stroke="#C9CCCE" stroke-width="2"/>
  <text x="1039" y="260" class="ptype">DATA FABRIC</text>
  <text x="1039" y="292" class="bt">PurchaseOrders</text>
  <text x="1039" y="320" class="bd">found by PO number</text>

  <!-- compare (built) -->
  <rect x="1354" y="230" width="182" height="130" rx="14" fill="#0BA2B3"/>
  <text x="1370" y="260" class="ptype" style="fill:#FFFFFF">YOU BUILD · SCRIPT</text>
  <text x="1370" y="292" font-size="20" font-weight="700" fill="#FFFFFF">Compare</text>
  <text x="1370" y="320" font-size="16" fill="#FFFFFF">invoice vs purchase</text>
  <text x="1370" y="340" font-size="16" fill="#FFFFFF">order, field by field</text>

  <!-- row 1 arrows + pills (pill sits above the arrow) -->
  <path class="flow" d="M210,318 H359"/>
  <g class="pill"><rect x="225" y="258" width="122" height="40" rx="14"/></g>
  <text x="286" y="284" class="pt">discrepancy</text>

  <path class="flow" d="M541,318 H690"/>
  <g class="pill"><rect x="548" y="246" width="136" height="54" rx="14"/></g>
  <text x="616" y="269" class="pt">Invoice PDF</text><text x="616" y="289" class="ps">in InvoicesStorage</text>

  <path class="flow" d="M872,318 H1021"/>
  <g class="pill"><rect x="879" y="246" width="136" height="54" rx="14"/></g>
  <text x="947" y="269" class="pt">Invoice JSON</text><text x="947" y="289" class="ps">incl. PO number</text>

  <path class="flow" d="M1203,318 H1352"/>
  <g class="pill"><rect x="1210" y="246" width="136" height="54" rx="14"/></g>
  <text x="1278" y="269" class="pt">PO JSON</text><text x="1278" y="289" class="ps">the order lines</text>

  <!-- identical -> pay (right edge, down) -->
  <path class="flow" d="M1500,360 V626"/>
  <text x="1490" y="518" class="rl" text-anchor="end">identical</text>

  <!-- differs -> agent -->
  <path class="flow" d="M1400,360 V470 H500 V600"/>
  <text x="1412" y="420" class="rl">differs</text>
  <g class="pill"><rect x="760" y="440" width="380" height="60" rx="14"/></g>
  <text x="950" y="466" class="pt">Invoice JSON + PO JSON + differences</text>
  <text x="950" y="487" class="ps">every field that doesn't match, with its line</text>

  <!-- ===== Row 2 ===== -->
  <!-- agent -->
  <rect x="380" y="602" width="240" height="150" rx="14" fill="#0BA2B3"/>
  <text x="398" y="634" class="ptype" style="fill:#FFFFFF">YOU BUILD · AGENT</text>
  <text x="398" y="668" font-size="21" font-weight="700" fill="#FFFFFF">Invoice Matching</text>
  <text x="398" y="694" font-size="21" font-weight="700" fill="#FFFFFF">Agent</text>
  <text x="398" y="726" font-size="16" fill="#FFFFFF">rates and explains</text>

  <!-- app -->
  <rect x="900" y="602" width="240" height="150" rx="14" fill="#EEEFF0" stroke="#C9CCCE" stroke-width="2"/>
  <text x="918" y="634" class="ptype">ACTION APP</text>
  <text x="918" y="668" class="bt">Invoice Validation</text>
  <text x="918" y="700" class="bd">a person decides in</text>
  <text x="918" y="722" class="bd">Action Center</text>

  <!-- pay -->
  <rect x="1360" y="628" width="176" height="96" rx="14" fill="#EEEFF0" stroke="#C9CCCE" stroke-width="2"/>
  <text x="1376" y="656" class="ptype">DATA FABRIC</text>
  <text x="1376" y="684" class="bt">Pay</text>
  <text x="1376" y="708" class="bd">PaymentsQueue row</text>

  <!-- e-mail -->
  <rect x="1360" y="764" width="176" height="96" rx="14" fill="#EEEFF0" stroke="#C9CCCE" stroke-width="2"/>
  <text x="1376" y="792" class="ptype">SHARED GMAIL</text>
  <text x="1376" y="820" class="bt">Reject</text>
  <text x="1376" y="844" class="bd">e-mail via Gmail</text>

  <!-- agent -> app (yellow/red) -->
  <path class="flow" d="M620,690 H898"/>
  <g class="pill"><rect x="640" y="606" width="240" height="70" rx="14"/></g>
  <text x="760" y="632" class="pt">Match result</text>
  <text x="760" y="652" class="ps">rating, a note per difference,</text>
  <text x="760" y="669" class="ps">summary, e-mail draft</text>
  <text x="652" y="716" class="rl">yellow or red</text>
  <text x="652" y="738" font-size="13" fill="#4D5459">+ invoice JSON, PO number, PDF</text>

  <!-- agent green -> pay (over the app) -->
  <path class="flow" d="M560,602 V550 H1420 V626"/>
  <text x="1170" y="540" class="rl">green</text>

  <!-- app -> pay / reject -->
  <path class="flow" d="M1140,676 H1358"/>
  <g class="pill"><rect x="1166" y="616" width="166" height="54" rx="14"/></g>
  <text x="1249" y="639" class="pt">Approve</text><text x="1249" y="659" class="ps">+ reviewer e-mail</text>

  <path class="flow" d="M1140,720 H1250 V812 H1358"/>
  <g class="pill"><rect x="1166" y="752" width="166" height="54" rx="14"/></g>
  <text x="1249" y="775" class="pt">Reject</text><text x="1249" y="795" class="ps">+ edited e-mail</text>

  <!-- legend -->
  <g font-size="15" fill="#4D5459">
    <rect x="70" y="800" width="26" height="18" rx="4" fill="#EEEFF0" stroke="#C9CCCE" stroke-width="1.5"/><text x="104" y="814">provided in Tools</text>
    <rect x="250" y="800" width="26" height="18" rx="4" fill="#0BA2B3"/><text x="284" y="814">you build</text>
    <rect x="380" y="800" width="26" height="18" rx="9" fill="#CCF2FF" stroke="#1E6482" stroke-width="1.5"/><text x="414" y="814">data passed by Maestro</text>
  </g>
</svg>
