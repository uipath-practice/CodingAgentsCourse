site_name: UiPath Coding Agents Workshop
site_url: https://uipath-practice.github.io/CodingAgentsCourse/
site_description: Hands-on learner's handbook for building UiPath agents and Maestro orchestrations with coding agents
site_author: Sergey Shumilov

# hello-world-agent/ was merged into getting-started/. The old folder is excluded here
# (the sandbox mount couldn't delete it) — remove the folder locally when convenient.
exclude_docs: |
  hello-world-agent/
  getting-started/4-run-and-review.md

theme:
  name: material
  logo: assets/images/Partner Success Logo.png
  favicon: assets/images/favicon.png
  font:
    text: Inter
  palette:
    scheme: default
    primary: deep orange
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link

hooks:
  - hooks/split_cols.py

# main.py provides environment variables (training_url, training_tenant, env_label)
# driven by the COURSE_ENV env var (staging | prod). See main.py.
plugins:
  - search
  - macros:
      module_name: main

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# Published navigation only. Work-in-progress pages live in mkdocs.local.yml.
nav:
  - Home: index.md
  - Getting Started with Coding Agents:
    - Overview: getting-started/index.md
    - 1. Installing the CLI and Skills: getting-started/1-install-the-cli-and-skills.md
    - 2. Practicing the CLI: getting-started/2-practice-the-cli.md
    - 3. Build Your First Agent: getting-started/3-build-your-first-agent.md
    - You did it!: getting-started/you-did-it.md
  - Loan Application Underwriting:
    - Agenda: loan-application-underwriting/agenda.md
    - What's a Coding Agent?: loan-application-underwriting/what-is-a-coding-agent.md
    - Overview: loan-application-underwriting/index.md
    - Installation Guides: loan-application-underwriting/installation-guides.md
    - Install UiPath Skills: loan-application-underwriting/install-skills.md
    - 1. AI Underwriting Assessment: loan-application-underwriting/1-underwriting-agent.md
    - 2. Loan Officer Review Dashboard: loan-application-underwriting/2-loan-officer-app.md
    - 3. Orchestrating with Maestro Flow: loan-application-underwriting/3-maestro-flow.md
    - 4. Application Intake & Enrichment: loan-application-underwriting/4-intake-enrichment.md
    - You did it!: loan-application-underwriting/you-did-it.md
  - Next Steps: next-steps.md

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  generator: false
